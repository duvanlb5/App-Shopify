# fly.toml app configuration file generated for esprit-shopify-tools on 2026-09-28T21:11:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'esprit-shopify-tools'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'npx prisma migrate deploy'

[env]
  CRON_SECRET = 'change-me-on-first-deploy'
  DATABASE_URL = 'file:/data/prisma/dev.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'esprit_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  ports = []

  [services.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
