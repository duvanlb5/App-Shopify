app = "esprit-shopify-tools"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/prisma/dev.db"
  CRON_SECRET = "change-me-on-first-deploy"

[mounts]
  source = "esprit_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
